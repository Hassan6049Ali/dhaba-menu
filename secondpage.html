<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Dhaba - Menu</title>
    <style>
        /* Hassan Ali 26i-6049 SE_A */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        /* Header & Navigation */
        header {
            background-color: #000000;
            color: #ffffff;
            padding: 20px 10px;
            text-align: center;
        }

        header h1 {
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            margin: 0 5px;
            display: inline-block;
            transition: 0.2s;
        }

        nav a:hover, nav a.active {
            background-color: #ffffff;
            color: #000000;
        }

        /* Main Container */
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h3 {
            margin-top: 25px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background-color: #f0f0f0;
            padding: 5px 10px;
            border-left: 4px solid #000000;
        }

        /* Menu Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #000000;
            color: #ffffff;
            text-transform: uppercase;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            padding: 6px 14px;
            border: 1px solid #000000;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Footer */
        footer {
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            padding: 15px;
            border-top: 2px solid #000000;
            font-size: 14px;
            font-weight: bold;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Desi Dhaba</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html" class="active">Menu</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
