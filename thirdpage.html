<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Dhaba - Contact Us</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #ffffff; color: #000000; font-family: Arial, sans-serif; line-height: 1.6; }
        header { background-color: #000000; color: #ffffff; padding: 20px 10px; text-align: center; }
        header h1 { letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        nav a { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; font-size: 14px; font-weight: bold; margin: 0 5px; display: inline-block; }
        nav a:hover, nav a.active { background-color: #ffffff; color: #000000; }
        main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .contact-image { margin-bottom: 25px; border: 2px solid #000000; }
        .contact-image img { width: 100%; height: auto; display: block; }
        h2 { border-bottom: 2px solid #000000; padding-bottom: 8px; margin-bottom: 20px; text-transform: uppercase; }
        .info-box { border: 1px dashed #000000; padding: 15px; margin-bottom: 25px; line-height: 1.8; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #000000; font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; }
        .btn { display: inline-block; background-color: #000000; color: #ffffff; padding: 10px 20px; border: 1px solid #000000; font-weight: bold; text-transform: uppercase; font-size: 14px; text-decoration: none; cursor: pointer; }
        .btn:hover { background-color: #ffffff; color: #000000; }
        footer { background-color: #ffffff; color: #000000; text-align: center; padding: 15px; border-top: 2px solid #000000; font-size: 14px; font-weight: bold; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>Desi Dhaba</h1>
        <nav>
            <a href="index.html.html">Home</a>
            <a href="secondpage.html">Menu</a>
            <a href="thirdpage.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <div style="margin-bottom: 20px;">
            <a href="secondpage.html" class="btn">&larr; Back to Menu</a>
        </div>

        <div class="contact-image">
            <img src="dhaba_food.png" alt="Desi Dhaba Ambience">
        </div>

        <h2>Get In Touch</h2>
        
        <div class="info-box">
            <p><strong>Address:</strong> Main Highway Road, Near Campus Gate, Islamabad</p>
            <p><strong>Phone:</strong> +92 300 1234567</p>
            <p><strong>Hours:</strong> 12:00 PM - 12:00 AM (Open Daily)</p>
        </div>

        <h2>Send Us A Message / Special Request</h2>
        <form onsubmit="handleContactSubmit(event)">
            <div class="form-group">
                <label for="name">Customer Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required placeholder="03XXXXXXXXX">
            </div>
            <div class="form-group">
                <label for="message">Message / Notes:</label>
                <textarea id="message" rows="4" placeholder="Write your instructions here..."></textarea>
            </div>
            <button type="submit" class="btn">Submit Request</button>
        </form>
    </main>

    <footer>
        <p>Hassan Ali | 26i-6049 | SE A</p>
    </footer>

    <script>
        function handleContactSubmit(event) {
            event.preventDefault();
            const customerName = document.getElementById('name').value;
            alert("Thank you, " + customerName + "! Your message has been received.");
            event.target.reset();
        }
    </script>

</body>
</html>
